<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>life is beautiful</title>
    <meta name="description" content="a gesamtkunstwerk founded in 2023 by artist &amp; curator aloisius — an independent record label, a series of happenings and a multidisciplinary collective." />
    <link rel="canonical" href="https://w3by0g1.github.io/life-is-beautiful/" />

    <!-- The tab icon (the flower, in the text's brown on paper) and the

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- How a shared link looks: the flower embossed in the paper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="life is beautiful" />
    <meta property="og:title" content="life is beautiful" />
    <meta property="og:description" content="a gesamtkunstwerk founded in 2023 by artist &amp; curator aloisius — an independent record label, a series of happenings and a multidisciplinary collective." />
    <meta property="og:url" content="https://w3by0g1.github.io/life-is-beautiful/" />
    <meta property="og:image" content="https://w3by0g1.github.io/life-is-beautiful/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The life is beautiful flower, embossed in white paper" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="life is beautiful" />
    <meta name="twitter:description" content="a gesamtkunstwerk founded in 2023 by artist &amp; curator aloisius — an independent record label, a series of happenings and a multidisciplinary collective." />
    <meta name="twitter:image" content="https://w3by0g1.github.io/life-is-beautiful/og-image.png" />

    <!-- Who it is, for search engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "life is beautiful",
        "url": "https://w3by0g1.github.io/life-is-beautiful/",
        "logo": "https://w3by0g1.github.io/life-is-beautiful/icon-512.png",
        "description": "A gesamtkunstwerk founded in 2023 by artist & curator aloisius: an independent record label, a series of happenings and a multidisciplinary collective.",
        "foundingDate": "2023",
        "founder": { "@type": "Person", "name": "aloisius" },
        "sameAs": [
          "https://lifeisbeautifulrecords.bandcamp.com",
          "https://www.instagram.com/youarethestream/"
        ]
      }
    </script>

    <!-- viewport-fit=cover: draw under the phone's status bar and browser bars too. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fbfc" />
    <!-- Added to the home screen, it opens full screen with the paper under the status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap" rel="stylesheet" />
